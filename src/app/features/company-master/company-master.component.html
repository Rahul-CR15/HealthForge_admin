<p-toast></p-toast>
<div class="p-4">
    <div class="flex justify-between items-center mb-4">
        <h2 class="text-2xl font-bold">Company Masters</h2>
        <button pButton label="New Company" icon="pi pi-plus" (click)="openNew()"></button>
    </div>

    <p-table [value]="companies()" [paginator]="true" [rows]="10" responsiveLayout="scroll">
        <ng-template pTemplate="header">
            <tr>
                <th>Company</th>
                <th>Contact</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
        </ng-template>
        <ng-template pTemplate="body" let-company>
            <tr>
                <td>{{ company.companyName }}</td>
                <td>{{ company.firstName }} {{ company.lastName }}</td>
                <td>{{ company.email }}</td>
                <td>{{ company.phoneCode ? '+' + company.phoneCode + ' ' : ''}}{{ company.phone }}</td>
                <td>
                    <button pButton icon="pi pi-pencil" class="p-button-text" (click)="editCompany(company)"></button>
                    <button pButton icon="pi pi-trash" class="p-button-text p-button-danger" (click)="deleteCompany(company)"></button>
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog header="{{ isNew() ? 'New Company' : 'Edit Company' }}" [(visible)]="sidebarVisible" [modal]="true" styleClass="right-dialog" [style]="{ height: '100vh' }">
    <div class="p-fluid grid grid-cols-2 gap-4">
        <div class="p-field col-span-2">
            <label for="companyName">Company Name</label>
            <input id="companyName" pInputText [(ngModel)]="editing().companyName" />
        </div>
        <div class="p-field grid grid-cols-3 gap-2 col-span-2">
            <div class="col-span-1">
                <label for="firstName">First Name</label>
                <input id="firstName" pInputText [(ngModel)]="editing().firstName" />
            </div>
            <div class="col-span-1">
                <label for="middleName">Middle Name</label>
                <input id="middleName" pInputText [(ngModel)]="editing().middleName" />
            </div>
            <div class="col-span-1">
                <label for="lastName">Last Name</label>
                <input id="lastName" pInputText [(ngModel)]="editing().lastName" />
            </div>
        </div>
        <div class="p-field">
            <label for="openingHr">Opening Hour</label>
            <input id="openingHr" pInputText [(ngModel)]="editing().openingHr" placeholder="e.g. 9AM - 5PM" />
        </div>
        <div class="p-field">
            <label for="address">Address</label>
            <input id="address" pInputText [(ngModel)]="editing().address" />
        </div>
        <div class="p-field grid grid-cols-3 gap-2">
            <div class="col-span-1">
                <label for="city">City</label>
                <input id="city" pInputText [(ngModel)]="editing().city" />
            </div>
            <div class="col-span-1">
                <label for="state">State</label>
                <input id="state" pInputText [(ngModel)]="editing().state" />
            </div>
            <div class="col-span-1">
                <label for="zipcode">Zipcode</label>
                <input id="zipcode" pInputText [(ngModel)]="editing().zipcode" />
            </div>
        </div>
        <div class="p-field">
            <label for="email">Email</label>
            <input id="email" pInputText [(ngModel)]="editing().email" />
        </div>
        <div class="p-field grid grid-cols-2 gap-2">
            <div class="col-span-1">
                <label for="password">Password</label>
                <p-password id="password" [(ngModel)]="editing().password" [feedback]="false"></p-password>
            </div>
            <div class="col-span-1">
                <label for="repassword">Re-password</label>
                <p-password id="repassword" [(ngModel)]="editing().password" [feedback]="false"></p-password>
            </div>
        </div>
        <div class="p-field grid grid-cols-3 gap-2">
            <div class="col-span-1">
                <label for="phoneCode">Phone Code</label>
                <input id="phoneCode" pInputText [(ngModel)]="editing().phoneCode" placeholder="e.g. 1" />
            </div>
            <div class="col-span-2">
                <label for="phone">Phone Number</label>
                <input id="phone" pInputText [(ngModel)]="editing().phone" />
            </div>
        </div>
    </div>
    <p-footer>
        <button pButton label="Cancel" icon="pi pi-times" class="p-button-text" (click)="cancel()"></button>
        <button pButton label="Save" icon="pi pi-check" (click)="save()" [disabled]="!editing().companyName"></button>
    </p-footer>
</p-dialog>
