<p-toast></p-toast>
<app-topbar />

<div class="bg-surface-50 dark:bg-surface-950 flex items-center justify-center w-full min-h-screen pt-4 pb-4">
    <div
        class="w-full max-w-[900px] bg-surface-0 dark:bg-surface-900 rounded-[16px] shadow-sm border border-surface-200 dark:border-surface-700 overflow-hidden">
        <!-- Header -->
        <div class="p-6 border-b border-surface-200 dark:border-surface-700 bg-surface-50/50 dark:bg-surface-800/50">
            <h1 class="text-2xl font-bold text-surface-900 dark:text-surface-0 mb-1">Health Forge</h1>
            <p class="text-sm text-muted-color">Create a professional enterprise account for your hospital</p>
        </div>

        <form (ngSubmit)="onSignup()" class="p-6 md:p-8">
            <!-- SECTION 1: Hospital Information -->
            <div class="mb-8">
                <div class="flex items-center gap-2 mb-4">
                    <div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center">
                        <i class="pi pi-building text-primary"></i>
                    </div>
                    <h2 class="text-lg font-semibold text-surface-900 dark:text-surface-0 m-0">Hospital Information</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
                    <div class="flex flex-col gap-1">
                        <label class="text-sm font-medium">Hospital Name <span class="text-red-500">*</span></label>
                        <input pInputText type="text" [(ngModel)]="hospitalName" name="hospitalName" required
                            placeholder="Enter hospital name" />
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-sm font-medium">Hospital Email <span class="text-red-500">*</span></label>
                        <input pInputText type="email" [(ngModel)]="hospitalEmail" name="hospitalEmail" required
                            placeholder="hospital@example.com" />
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-sm font-medium">Hospital Phone <span class="text-red-500">*</span></label>
                        <p-inputMask mask="(999) 999-9999" [(ngModel)]="hospitalPhone" name="hospitalPhone"
                            placeholder="(999) 999-9999" styleClass="w-full"></p-inputMask>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-sm font-medium">Hospital Type <span class="text-red-500">*</span></label>
                        <p-select [options]="hospitalTypes" [(ngModel)]="hospitalType" name="hospitalType"
                            optionLabel="label" optionValue="value" placeholder="Select type"
                            styleClass="w-full"></p-select>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-sm font-medium">Registration Number</label>
                        <input pInputText type="text" [(ngModel)]="registrationNumber" name="registrationNumber"
                            placeholder="REG-123456" />
                    </div>
                    <div class="flex flex-col gap-1 md:col-span-1">
                        <!-- Placeholder for alignment or extra field -->
                    </div>
                    <div class="flex flex-col gap-1 md:col-span-2">
                        <label class="text-sm font-medium">Hospital Address</label>
                        <p-textarea rows="2" [(ngModel)]="hospitalAddress" name="hospitalAddress"
                            placeholder="Full street address, city, state" class="w-full resize-none"></p-textarea>
                    </div>
                </div>
            </div>

            <!-- SECTION 2: Admin Information -->
            <div class="mb-8 p-6 bg-surface-50 dark:bg-surface-800/20 rounded-xl">
                <div class="flex items-center gap-2 mb-4">
                    <div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center">
                        <i class="pi pi-user text-primary"></i>
                    </div>
                    <h2 class="text-lg font-semibold text-surface-900 dark:text-surface-0 m-0">Admin Account Information
                    </h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
                    <div class="flex flex-col gap-1">
                        <label class="text-sm font-medium">Full Name <span class="text-red-500">*</span></label>
                        <input pInputText type="text" [(ngModel)]="adminName" name="adminName" required
                            placeholder="John Doe" />
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-sm font-medium">Admin Email <span class="text-red-500">*</span></label>
                        <input pInputText type="email" [(ngModel)]="adminEmail" name="adminEmail" required
                            placeholder="admin@hospital.com" />
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-sm font-medium">Admin Phone <span class="text-red-500">*</span></label>
                        <p-inputMask mask="(999) 999-9999" [(ngModel)]="adminPhone" name="adminPhone"
                            placeholder="(999) 999-9999" styleClass="w-full"></p-inputMask>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-sm font-medium">Gender</label>
                        <p-select [options]="genders" [(ngModel)]="gender" name="gender" optionLabel="label"
                            optionValue="value" placeholder="Optional" styleClass="w-full"></p-select>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-sm font-medium">Password <span class="text-red-500">*</span></label>
                        <p-password [(ngModel)]="password" name="password" [toggleMask]="true" [feedback]="true"
                            styleClass="w-full" inputStyleClass="w-full" placeholder="Min 8 chars"></p-password>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-sm font-medium">Confirm Password <span class="text-red-500">*</span></label>
                        <p-password [(ngModel)]="confirmPassword" name="confirmPassword" [toggleMask]="true"
                            [feedback]="false" styleClass="w-full" inputStyleClass="w-full"
                            placeholder="Re-enter password"></p-password>
                    </div>
                </div>
            </div>

            <!-- SECTION 3: System Setup -->
            <div class="mb-8">
                <div class="flex items-center gap-2 mb-4">
                    <div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center">
                        <i class="pi pi-cog text-primary"></i>
                    </div>
                    <h2 class="text-lg font-semibold text-surface-900 dark:text-surface-0 m-0">System Setup</h2>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-x-6 gap-y-4">
                    <div class="flex flex-col gap-1">
                        <label class="text-sm font-medium">Time Zone</label>
                        <p-select [options]="timeZones" [(ngModel)]="timeZone" name="timeZone" optionLabel="label"
                            optionValue="value" placeholder="Select Time Zone" styleClass="w-full"></p-select>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-sm font-medium">Currency</label>
                        <p-select [options]="currencies" [(ngModel)]="currency" name="currency" optionLabel="label"
                            optionValue="value" placeholder="Select Currency" styleClass="w-full"></p-select>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-sm font-medium">Subscription Plan</label>
                        <p-select [options]="subscriptionPlans" [(ngModel)]="subscriptionPlan" name="subscriptionPlan"
                            optionLabel="label" optionValue="value" placeholder="Choose a plan"
                            styleClass="w-full"></p-select>
                    </div>
                    <div class="flex items-end pb-1">
                        <div class="flex items-center gap-2">
                            <p-checkbox [(ngModel)]="agreeTerms" [binary]="true" inputId="terms"
                                name="agreeTerms"></p-checkbox>
                            <label for="terms" class="text-sm">I agree to the <a href="#"
                                    class="text-primary font-medium hover:underline">Terms & Conditions</a></label>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex flex-col gap-4 mt-4">
                <p-button label="Create Hospital Account" styleClass="w-full py-4 text-lg font-bold"
                    type="submit"></p-button>
                <div class="text-center text-sm text-muted-color">
                    Already have an account? <a routerLink="/login"
                        class="text-primary font-semibold hover:underline">Sign In</a>
                </div>
            </div>
        </form>

        <!-- Footer Info -->
        <div
            class="p-4 bg-surface-50 dark:bg-surface-800 border-t border-surface-200 dark:border-surface-700 text-center text-xs text-muted-color">
            <i class="pi pi-shield mr-1"></i> Your data is secured with enterprise-grade encryption.
        </div>
    </div>
</div>

<app-footer />
