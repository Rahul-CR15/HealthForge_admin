<div class="facility-page surface-section px-4 md:px-0 lg:px-0">
    <div class="facility-header mb-4">
        <div>
            <h1 class="facility-title">Facility</h1>
            <p class="facility-subtitle">Facility management dashboard for system-wide operations.</p>
        </div>

        <div class="facility-actions">
            <div class="search-box">
                <i class="pi pi-search search-icon"></i>
                <input pInputText type="search" class="search-input" placeholder="Search Facility"
                    [(ngModel)]="searchText" (input)="searchByText()" />
            </div>

            <button pButton pRipple type="button" label="Add New Facility" class="p-button-primary"
                (click)="openModal()"></button>
        </div>
    </div>

    <div class="facility-tabs mb-4">
        <p-tabs [(value)]="activeIndex" (valueChange)="onTabChange($event)">
            <p-tabpanel header="Without Company"></p-tabpanel>
            <p-tabpanel header="With Company"></p-tabpanel>
        </p-tabs>
    </div>

    <div class="table-wrapper surface-card shadow-1 border-round p-4">
        <div class="table-scroll">
            <p-table class="facility-table p-datatable-striped" [value]="currentPageItems" [sortMode]="'single'"
                [tableStyle]="{ minWidth: '860px' }">
                <ng-template pTemplate="colgroup" let-columns>
                    <colgroup>
                        <col style="width:180px" />
                        <col style="width:180px" />
                        <col style="width:180px" />
                        <col style="width:220px" />
                        <col style="width:120px" />
                    </colgroup>
                </ng-template>

                <ng-template pTemplate="header" let-columns>
                    <tr>
                        <th pSortableColumn="name">
                            Name <p-sortIcon field="name"></p-sortIcon>
                        </th>
                        <th *ngIf="activeIndex === 1">Company Name</th>
                        <th pSortableColumn="facilityTypeName">
                            Facility Type <p-sortIcon field="facilityTypeName"></p-sortIcon>
                        </th>
                        <th pSortableColumn="primaryContactName">
                            Primary Contact <p-sortIcon field="primaryContactName"></p-sortIcon>
                        </th>
                        <th>Address</th>
                        <th>Action</th>
                    </tr>
                </ng-template>

                <ng-template pTemplate="body" let-item let-columns="columns">
                    <tr>
                        <td>
                            <div class="cell-label">{{ item.name }}</div>
                        </td>
                        <td *ngIf="activeIndex === 1">
                            <div class="cell-label truncate" [title]="item.companyName">{{ item.companyName }}</div>
                        </td>
                        <td>
                            <div class="cell-label">{{ item.facilityTypeName }}</div>
                        </td>
                        <td>
                            <div class="cell-label truncate" [title]="item.primaryContactName">{{
                                item.primaryContactName }}</div>
                        </td>
                        <td>
                            <div class="cell-label truncate" [title]="item.address1">{{ item.address1 }}</div>
                        </td>
                        <td>
                            <div class="action-buttons">
                                <button pButton pRipple type="button" icon="pi pi-pencil"
                                    class="p-button-rounded p-button-text" (click)="openModal(item)"></button>
                                <button pButton pRipple type="button" icon="pi pi-trash"
                                    class="p-button-rounded p-button-secondary p-button-text"
                                    (click)="deleteItem(item.id)"></button>
                            </div>
                        </td>
                    </tr>
                </ng-template>

                <ng-template pTemplate="emptymessage">
                    <ng-container *ngIf="isLoading">
                        <tr *ngFor="let row of [].constructor(8)">
                            <td *ngFor="let col of cols">
                                <p-skeleton width="100%" styleClass="p-m-0"></p-skeleton>
                            </td>
                        </tr>
                    </ng-container>
                    <tr *ngIf="!isLoading">
                        <td [attr.colspan]="activeIndex === 1 ? 6 : 5" class="p-text-center p-p-3">
                            <div class="empty-state">
                                <i class="pi pi-folder-open text-4xl mb-3"></i>
                                <div class="text-lg font-semibold">No Records Found!</div>
                                <div class="text-sm text-surface-500">No records has been added yet</div>
                            </div>
                        </td>
                    </tr>
                </ng-template>
            </p-table>
        </div>

        <div class="p-d-flex p-jc-end p-ai-center mt-4">
            <p-paginator [hidden]="isLoading" *ngIf="totalCount > 0" [totalRecords]="totalCount"
                [rowsPerPageOptions]="pageLimit" [rows]="limit" (onPageChange)="changePage($event)"></p-paginator>
        </div>
    </div>
</div>
