<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6 p-4">
  <div *ngFor="let item of orderCategoryList" (click)="openOrderDetail(item)"
    class="group master-order-item bg-surface-0 dark:bg-surface-800 rounded-xl shadow-sm border border-surface-200 dark:border-surface-700 p-5 cursor-pointer hover:shadow-md hover:border-emerald-500 dark:hover:border-emerald-400 transition-all duration-200 transform hover:-translate-y-1">
    <div class="flex items-center justify-between">
      <div>
        <h3
          class="text-surface-900 dark:text-surface-0 font-semibold text-lg m-0 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors ">
          {{item?.name}}
        </h3>
      </div>

      <div pRipple
        class="flex items-center justify-center bg-emerald-50 dark:bg-emerald-500/10 rounded-full w-10 h-10 group-hover:bg-emerald-500 transition-colors">
        <i class="pi pi-plus text-emerald-600 dark:text-emerald-400 group-hover:text-white text-lg"></i>
      </div>
    </div>
  </div>
</div>
