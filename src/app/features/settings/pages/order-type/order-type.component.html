<div class="sm-container">
    <div class="border-round flex inside justify-between m-0 mb-3 p-0 toolbar toolbar-style">
        <div>
            <span class="text-3xl font-medium text-900">Order Type {{ activeIndex }}</span>
        </div>
        <div class="ml-auto mr-3 flex align-items-center gap-2">
            <span class="mr-2">
                <p-select [options]="orderCategoryList" placeholder="Select Order Category" optionLabel="name"
                    [(ngModel)]="orderCategoryId" optionValue="id" (onChange)="getItemsList()" [showClear]="true"
                    styleClass="w-15rem">
                </p-select>
            </span>
            <div class="search-box">
                <i class="pi pi-search search-icon"></i>
                <input type="search" [(ngModel)]="searchText" placeholder="Search Order" (input)="searchByText()"
                    class="search-input" />
            </div>
            <button pButton pRipple (click)="openModal(null)" label="Add New Order"></button>
        </div>
    </div>

    <p-table class="d-table" [value]="itemList" styleClass="p-datatable-striped">
        <ng-template pTemplate="colgroup" let-columns>
            <colgroup>
                <col style="width:240px" />
                <col style="width:200px" />
                <col style="width:80px" />
            </colgroup>
        </ng-template>

        <ng-template pTemplate="header" let-columns>
            <tr>
                <th pSortableColumn="name">
                    Name <p-sortIcon field="name"></p-sortIcon>
                </th>
                <th pSortableColumn="orderCategoryName">
                    Order Category <p-sortIcon field="orderCategoryName"></p-sortIcon>
                </th>
                <th>Action</th>
            </tr>
        </ng-template>

        <ng-template pTemplate="body" let-item let-columns="columns">
            <tr>
                <td>{{ item.name }}</td>
                <td>{{ item.orderCategoryName }}</td>
                <td>
                    <div class="mt-2 md:mt-0 flex flex-nowrap">
                        <button pButton pRipple type="button" icon="pi pi-pencil" (click)="openModal(item)"
                            class="p-button-rounded p-button-text"></button>
                        <button pButton pRipple type="button" icon="pi pi-trash" (click)="deleteItem(item)"
                            class="p-button-rounded p-button-secondary p-button-text ml-2"></button>
                    </div>
                </td>
            </tr>
        </ng-template>

        <ng-template pTemplate="emptymessage">
            <ng-container *ngIf="isLoading">
                <tr *ngFor="let row of [].constructor(8)">
                    <td *ngFor="let cell of [].constructor(3)">
                        <p-skeleton styleClass="p-m-0"></p-skeleton>
                    </td>
                </tr>
            </ng-container>
            <tr *ngIf="!isLoading">
                <td colspan="3" class="p-text-center p-p-3">
                    <div class="text-center">
                        <i class="pi pi-folder-open text-4xl mb-3"></i>
                        <div class="text-lg font-semibold">No order found!</div>
                        <div class="text-sm text-surface-500">No orders have been added yet</div>
                    </div>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <p-paginator [hidden]="isLoading" *ngIf="totalCount > 0" (onPageChange)="changePage($event)"
        [totalRecords]="totalCount" [rowsPerPageOptions]="pageLimit" [rows]="limit"></p-paginator>
</div>
